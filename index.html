<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Foto Ímã</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">📸</div>

      <h1>Foto Ímã</h1>

      <p class="descricao">
        Compartilhe este momento especial!
      </p>

      <div class="grupo">

        <label for="nome">
          Nome
        </label>

        <input
          id="nome"
          type="text"
          placeholder="Digite seu nome"
          autocomplete="name"
        >

      </div>

      <div class="botoes-foto">

        <label
          for="camera"
          class="botao-foto botao-camera"
        >
          <span class="icone-botao">📷</span>
          <span>Câmera</span>
        </label>

        <label
          for="galeria"
          class="botao-foto botao-galeria"
        >
          <span class="icone-botao">🖼️</span>
          <span>Galeria</span>
        </label>

      </div>

      <input
        id="camera"
        class="input-arquivo"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <input
        id="galeria"
        class="input-arquivo"
        type="file"
        accept="image/*"
      >

      <div
        id="preview"
        class="preview"
      >

        <div
          id="placeholder"
          class="placeholder"
        >
          <div class="icone-preview">📷</div>

          <p>
            Sua foto aparecerá aqui
          </p>
        </div>

        <img
          id="imagemPreview"
          class="imagem-preview"
          alt="Pré-visualização da foto selecionada"
        >

      </div>

      <p
        id="nomeFoto"
        class="nome-arquivo"
      >
        Nenhuma foto selecionada
      </p>

      <button
        id="btnTrocar"
        class="botao-trocar"
        type="button"
        hidden
      >
        🔄 Trocar foto
      </button>

      <button
        id="btnEnviar"
        class="botao-enviar"
        type="button"
      >
        Enviar foto
      </button>

      <div
        id="mensagem"
        class="mensagem"
        aria-live="polite"
      ></div>

      <p class="rodape">
        ❤️ Obrigado por participar!
      </p>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
